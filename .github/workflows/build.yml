name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLAY_REF: 1f27232772e484bfb79364b751b84f41f4c87481
  VULKAN_SDK_VERSION: '1.4.309.0'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout HUSH EMULATOR
        uses: actions/checkout@v4
        with:
          path: hush

      - name: Checkout Play! core
        run: |
          git clone https://github.com/jpd002/Play-.git Play-
          cd Play-
          git checkout "$PLAY_REF"
          git submodule update --init --recursive
          git fetch --tags --force

      - name: Apply HUSH EMULATOR patch
        run: |
          cd Play-
          git apply --whitespace=nowarn ../hush/ios/hush-emulator.patch
          git apply --whitespace=nowarn ../hush/ios/hush-features.patch
          (cd deps/CodeGen && git apply --whitespace=nowarn ../../../hush/ios/hush-codegen.patch)

      - name: Install tools
        run: brew install dpkg

      - name: Install Vulkan SDK
        run: |
          cd "$RUNNER_WORKSPACE"
          curl -L --show-error --output vulkansdk.zip "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkansdk-macos-${VULKAN_SDK_VERSION}.zip?Human=true"
          unzip -q vulkansdk.zip
          sudo ./InstallVulkan-${VULKAN_SDK_VERSION}.app/Contents/MacOS/InstallVulkan-${VULKAN_SDK_VERSION} in --al --c com.lunarg.vulkan.ios
          echo "VULKAN_SDK=${HOME}/VulkanSDK/${VULKAN_SDK_VERSION}/iOS" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cd Play-
          mkdir build && cd build
          cmake .. -G"Xcode" -DCMAKE_TOOLCHAIN_FILE=../deps/Dependencies/cmake-ios/ios.cmake -DTARGET_IOS=ON -DCMAKE_PREFIX_PATH=$VULKAN_SDK

      - name: Build
        run: |
          cd Play-/build
          cmake --build . --config Release
          codesign --remove-signature Source/ui_ios/Release-iphoneos/Play.app

      - name: Package IPA
        run: |
          cd Play-
          mkdir -p Payload
          rsync -a build/Source/ui_ios/Release-iphoneos/Play.app/* Payload/HushEmulator.app
          cp ../hush/ios/Play-LICENSE.txt Payload/HushEmulator.app/
          zip -qr HushEmulator-5.0.0.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HushEmulator-5.0.0-ipa
          path: Play-/HushEmulator-5.0.0.ipa
